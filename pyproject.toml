[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "contextlab"
version = "0.1.0"
description = "Instrumento experimental de seleção de contexto e geração de testes"
readme = "README.md"
license = "MIT"
authors = [{ name = "Gabriel Lopes Pereira" }]
requires-python = ">=3.11"
dependencies = ["pytest==8.4.2", "coverage==7.10.7", "rich==14.1.0"]

[project.scripts]
contextlab = "contextlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
contextlab = ["viewer/*.html", "viewer/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
norecursedirs = ["fixtures"]

