<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ContextLab</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20512%20512%22%20width%3D%22512%22%20height%3D%22512%22%3E%3Crect%20width%3D%22512%22%20height%3D%22512%22%20rx%3D%22116%22%20fill%3D%22%2318181B%22%2F%3E%3Cpath%20d%3D%22M365.7%20134.1%20A164%20164%200%201%200%20365.7%20377.9%22%20fill%3D%22none%22%20stroke%3D%22%23F97316%22%20stroke-width%3D%2230%22%20stroke-linecap%3D%22round%22%2F%3E%3Cpath%20d%3D%22M330.9%20172.8%20A112%20112%200%201%200%20330.9%20339.2%22%20fill%3D%22none%22%20stroke%3D%22%2314B8A6%22%20stroke-width%3D%2230%22%20stroke-linecap%3D%22round%22%2F%3E%3Cpath%20d%3D%22M296.1%20211.4%20A60%2060%200%201%200%20296.1%20300.6%22%20fill%3D%22none%22%20stroke%3D%22%233B82F6%22%20stroke-width%3D%2230%22%20stroke-linecap%3D%22round%22%2F%3E%3Ccircle%20cx%3D%22256%22%20cy%3D%22256%22%20r%3D%2218%22%20fill%3D%22%23FAFAFA%22%2F%3E%3C%2Fsvg%3E">
<script>
// Tema aplicado antes do primeiro desenho, para a página não piscar no tema errado.
(function () {
  var theme = new URLSearchParams(location.search).get("tema");
  if (theme !== "light" && theme !== "dark") {
    try { theme = localStorage.getItem("contextlab-tema"); } catch (error) { theme = null; }
  }
  if (theme !== "light" && theme !== "dark") theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  document.documentElement.dataset.theme = theme;
  document.documentElement.classList.add("js");
})();
</script>
<style>
:root {
  --bg: #fafafa; --panel: #ffffff; --panel-2: #f4f4f5; --hover: #f4f4f5; --ink: #18181b; --muted: #71717a; --faint: #a1a1aa;
  --line: #e4e4e7; --accent: #6366f1; --accent-ink: #ffffff; --accent-soft: #eef2ff; --code-bg: #f6f6f7;
  --ok: #16a34a; --ok-bg: #dcfce7; --bad: #dc2626; --bad-bg: #fee2e2; --wait: #b45309; --wait-bg: #fef3c7; --infra: #7c3aed; --infra-bg: #ede9fe; --idle: #71717a; --idle-bg: #f4f4f5;
  --L: #3b82f6; --R: #0d9488; --A: #ea580c; --L-bg: #dbeafe; --R-bg: #ccfbf1; --A-bg: #ffedd5;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: "SF Mono", ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;
  --r: 10px;
}
:root[data-theme="dark"] {
  --bg: #09090b; --panel: #111113; --panel-2: #18181b; --hover: #1c1c20; --ink: #fafafa; --muted: #a1a1aa; --faint: #71717a;
  --line: #27272a; --accent: #818cf8; --accent-ink: #09090b; --accent-soft: rgba(129, 140, 248, .14); --code-bg: #0c0c0e;
  --ok: #4ade80; --ok-bg: rgba(74, 222, 128, .12); --bad: #f87171; --bad-bg: rgba(248, 113, 113, .12); --wait: #fbbf24; --wait-bg: rgba(251, 191, 36, .12);
  --infra: #c4b5fd; --infra-bg: rgba(196, 181, 253, .12); --idle: #a1a1aa; --idle-bg: rgba(161, 161, 170, .12);
  --L: #60a5fa; --R: #2dd4bf; --A: #fb923c; --L-bg: rgba(96, 165, 250, .14); --R-bg: rgba(45, 212, 191, .14); --A-bg: rgba(251, 146, 60, .14);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; font-feature-settings: "cv11", "ss01"; }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
code, pre, .mono { font-family: var(--mono); }
code { font-size: 12px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; }
.num, td.num, .stat strong, .cv span { font-variant-numeric: tabular-nums; }

.topbar { position: sticky; top: 0; z-index: 4; height: 52px; display: flex; align-items: center; gap: 20px; padding: 0 24px;
  background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: saturate(160%) blur(12px); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 650; font-size: 14px; letter-spacing: -.01em; }
.mark { width: 24px; height: 24px; display: block; flex: none; }
.nav { display: flex; gap: 2px; }
.nav button { padding: 6px 11px; border-radius: 7px; color: var(--muted); font-weight: 500; }
.nav button:hover { color: var(--ink); background: var(--hover); }
.nav button[aria-current="page"] { color: var(--ink); background: var(--panel-2); }
.site-link { margin-left: auto; padding: 6px 11px; border-radius: 7px; color: var(--muted); font-weight: 500; text-decoration: none; }
.site-link:hover { color: var(--ink); background: var(--hover); }
.site-link + .icon-btn { margin-left: 0; }
.icon-btn { margin-left: auto; width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: var(--muted); border: 1px solid var(--line); }
.icon-btn:hover { color: var(--ink); background: var(--hover); }
.icon-btn svg { width: 16px; height: 16px; }

main { max-width: 1400px; margin: 0 auto; padding: 24px 24px 64px; }
.head { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.crumb { color: var(--muted); font-size: 12.5px; font-family: var(--mono); }
.head h1 { margin: 2px 0 0; font-size: 22px; font-weight: 650; letter-spacing: -.02em; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
.tag { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); background: var(--panel); white-space: nowrap; }
.tag-mono { font-family: var(--mono); font-size: 11.5px; }
.tag-warn { color: var(--wait); background: var(--wait-bg); border-color: transparent; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; margin-bottom: 16px; }
.stat { background: var(--panel); padding: 14px 16px 13px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.stat-label { color: var(--muted); font-size: 12.5px; font-weight: 500; display: flex; gap: 5px; align-items: center; }
.stat strong { font-size: 24px; font-weight: 600; letter-spacing: -.02em; line-height: 1.2; }
.split { display: flex; gap: 10px; flex-wrap: wrap; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; margin-top: 2px; }
.split b { font-weight: 700; margin-right: 3px; }
.info { width: 13px; height: 13px; border-radius: 50%; border: 1px solid var(--faint); color: var(--faint); font-size: 9px; font-weight: 700; display: inline-grid; place-items: center; cursor: help; font-style: normal; }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); margin-bottom: 16px; overflow: hidden; }
.panel-head { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.panel-head h2 { margin: 0; font-size: 14px; font-weight: 600; }
.hint { color: var(--muted); font-size: 12.5px; display: flex; align-items: center; gap: 6px; }
.best-mark { display: inline-flex; align-items: center; gap: 4px; color: var(--ok); }
.best-mark::before, td.best .cv span::after { content: "▼"; font-size: 8px; }
td.best .cv span::after { margin-left: 5px; color: var(--ok); vertical-align: 1px; }

table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 9px 14px; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--line); }
tbody tr:last-child td { border-bottom: 0; }
th { font-size: 12px; font-weight: 500; color: var(--muted); background: var(--panel); }
th.num, td.num { text-align: right; }
table.compare th { padding-top: 11px; padding-bottom: 11px; }
table.compare td:first-child { color: var(--muted); width: 22%; }
table.compare th:not(:first-child), table.compare td:not(:first-child) { width: 26%; }
.colhead { display: flex; align-items: center; gap: 8px; color: var(--ink); font-size: 13px; font-weight: 600; }
.colhead small { color: var(--muted); font-weight: 400; font-size: 12px; }
.cv { display: flex; flex-direction: column; gap: 5px; }
.cv span { font-size: 13.5px; font-weight: 500; }
.cv i { display: block; height: 4px; border-radius: 99px; background: var(--panel-2); overflow: hidden; }
.cv i b { display: block; height: 100%; border-radius: 99px; background: var(--c); opacity: .85; }
td.best { background: color-mix(in srgb, var(--ok-bg) 45%, transparent); }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.toolbar label { position: relative; display: inline-flex; align-items: center; }
.toolbar label > span { position: absolute; left: 10px; color: var(--muted); font-size: 12px; pointer-events: none; }
select, input[type=search] { font: 13px var(--sans); color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; height: 32px; outline: none; }
select { appearance: none; -webkit-appearance: none; padding: 0 28px 0 var(--pad, 10px); cursor: pointer;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 14px) 13px, calc(100% - 10px) 13px; background-size: 4px 4px; background-repeat: no-repeat; }
select:hover, input[type=search]:hover { border-color: var(--faint); }
select:focus, input[type=search]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
input[type=search] { padding: 0 10px; min-width: 240px; }
.seg { display: inline-flex; padding: 2px; background: var(--panel-2); border-radius: 8px; margin-left: auto; }
.seg button { padding: 5px 11px; border-radius: 6px; color: var(--muted); font-size: 12.5px; font-weight: 500; }
.seg button[aria-pressed=true] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 0 0 1px var(--line); }
.count { color: var(--muted); font-size: 12.5px; }

.wrap { overflow: auto; }
.wrap > table > thead th { position: sticky; top: 0; z-index: 1; cursor: pointer; user-select: none; background: var(--panel); }
.wrap > table > thead th:hover { color: var(--ink); }
tbody tr.row { cursor: pointer; } tbody tr.row:hover td, td.pick:hover { background: var(--hover); }
.wrap > table td { font-variant-numeric: tabular-nums; }
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px 2px 7px; border-radius: 999px; font-size: 12px; font-weight: 500; }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.s-aprovada { color: var(--ok); background: var(--ok-bg); } .s-reprovada { color: var(--bad); background: var(--bad-bg); }
.s-aguardando { color: var(--wait); background: var(--wait-bg); } .s-infraestrutura { color: var(--infra); background: var(--infra-bg); }
.s-pendente, .s-sem { color: var(--idle); background: var(--idle-bg); }
.cond { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 5px; font-size: 11px; font-weight: 700; }
.c-L { color: var(--L); background: var(--L-bg); } .c-R { color: var(--R); background: var(--R-bg); } .c-A { color: var(--A); background: var(--A-bg); }
.split b.c-L, .split b.c-R, .split b.c-A { background: none; }
.target { font-family: var(--mono); font-size: 12.5px; }
.cell { display: flex; flex-direction: column; gap: 3px; white-space: normal; min-width: 200px; } .cell small { color: var(--muted); font-size: 12px; }
td.pick { cursor: pointer; vertical-align: top; }
.empty { padding: 40px; text-align: center; color: var(--muted); }
.muted { color: var(--muted); }

.backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, .4); z-index: 5; opacity: 0; pointer-events: none; transition: opacity .18s; }
.backdrop.open { opacity: 1; pointer-events: auto; }
aside.drawer { position: fixed; inset: 0 0 0 auto; width: min(880px, 100%); background: var(--panel); border-left: 1px solid var(--line);
  display: flex; flex-direction: column; z-index: 6; transform: translateX(102%); transition: transform .2s ease; box-shadow: -20px 0 50px rgba(0,0,0,.18); }
aside.drawer.open { transform: none; }
.drawer > header { padding: 16px 20px 12px; display: flex; gap: 12px; align-items: flex-start; }
.drawer > header h2 { margin: 0; font-size: 16px; font-weight: 600; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-family: var(--mono); }
.drawer > header p { margin: 4px 0 0; color: var(--muted); font-size: 12px; word-break: break-all; font-family: var(--mono); }
.ghost { margin-left: auto; padding: 5px 10px; border-radius: 7px; border: 1px solid var(--line); color: var(--muted); font-size: 12.5px; }
.ghost:hover { color: var(--ink); background: var(--hover); }
.tabs { display: flex; gap: 4px; padding: 0 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tabs button { padding: 9px 8px; color: var(--muted); font-weight: 500; font-size: 13px; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected=true] { color: var(--ink); border-bottom-color: var(--ink); }
.body { padding: 18px 20px 36px; overflow: auto; flex: 1; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 8px 22px; margin: 0 0 16px; font-size: 13px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; font-variant-numeric: tabular-nums; }
h3.sec { font-size: 12px; font-weight: 600; color: var(--muted); margin: 22px 0 8px; text-transform: uppercase; letter-spacing: .05em; }
pre { margin: 0; padding: 12px 14px; background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; overflow: auto; font-size: 12px; line-height: 1.6; white-space: pre; tab-size: 4; }
pre.wrapped { white-space: pre-wrap; word-break: break-word; }
ol.code { margin: 0; padding: 12px 14px 12px 54px; background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; overflow: auto; font: 12px/1.6 var(--mono); }
ol.code li { white-space: pre; color: var(--faint); } ol.code li span { color: var(--ink); }
.case { border: 1px solid var(--line); border-radius: 8px; margin-bottom: 6px; padding: 7px 11px; }
.case summary { cursor: pointer; display: flex; gap: 10px; align-items: center; } .case summary .mono { word-break: break-all; white-space: normal; font-size: 12px; }
.case pre { margin-top: 8px; }
.body .wrap { border: 1px solid var(--line); border-radius: 8px; }

.docs { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 40px; align-items: start; }
.toc { position: sticky; top: 76px; display: flex; flex-direction: column; gap: 1px; }
.toc b { font-size: 12px; font-weight: 600; color: var(--muted); padding: 0 10px 8px; }
.toc a { color: var(--muted); text-decoration: none; padding: 6px 10px; border-radius: 7px; font-size: 13.5px; }
.toc a:hover { color: var(--ink); background: var(--hover); }
.toc a.on { color: var(--ink); background: var(--panel-2); font-weight: 500; }
article.doc { max-width: 820px; font-size: 14.5px; line-height: 1.7; }
article.doc section { scroll-margin-top: 76px; padding-bottom: 28px; margin-bottom: 28px; border-bottom: 1px solid var(--line); }
article.doc section:last-child { border-bottom: 0; }
article.doc h2 { font-size: 22px; font-weight: 650; letter-spacing: -.02em; margin: 0 0 10px; }
article.doc h3 { font-size: 15.5px; font-weight: 600; margin: 26px 0 8px; }
article.doc h4 { margin: 0 0 6px; font-size: 14px; font-weight: 600; display: flex; gap: 8px; align-items: center; }
article.doc p { margin: 0 0 12px; } article.doc .lead { font-size: 15.5px; color: var(--ink); }
article.doc ul { margin: 0 0 12px; padding-left: 20px; } article.doc li { margin-bottom: 4px; }
.note { background: var(--panel-2); border-radius: 8px; padding: 10px 14px; color: var(--muted); font-size: 13.5px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; margin: 14px 0 16px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; margin: 12px 0 16px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 13px 15px; font-size: 13.5px; }
.tile p, .tile ul { margin: 0; }
.tile.ok h4 { color: var(--ok); } .tile.no h4 { color: var(--bad); }
table.doc { font-size: 13px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); border-collapse: separate; border-spacing: 0; overflow: hidden; margin: 10px 0 16px; }
table.doc th { background: var(--panel-2); }
table.doc th, table.doc td { white-space: normal; vertical-align: top; padding: 8px 12px; }
table.doc td:first-child { white-space: nowrap; } table.doc.opts { border: 0; border-radius: 0; background: none; } table.doc.opts td:first-child { width: 270px; }
.diagram { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; margin: 12px 0 16px; overflow: auto; text-align: center; }
.diagram svg { max-width: 100%; height: auto; }
pre.mermaid-src { font-size: 12px; }
/* Com script, a fonte do diagrama só aparece se o desenho falhar. */
.js pre.mermaid-src:not(.shown) { visibility: hidden; }
pre.code-sample { font-size: 12px; line-height: 1.65; } .cmt { color: var(--faint); font-style: italic; }
.cmd { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 15px 4px; margin: 8px 0; }
.cmd-head { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; margin-bottom: 4px; }
.cmd-head code { font-size: 13px; font-weight: 600; color: var(--ink); background: var(--panel-2); }
.cmd-head span { color: var(--muted); font-size: 13px; } .cmd p { font-size: 13.5px; }
[hidden] { display: none !important; }
@media (max-width: 520px) { body.site .nav { display: none; } }
/* Celular: sumário em uma linha rolável presa abaixo da barra, tabelas que quebram linha
   e diagramas largos com rolagem horizontal em vez de encolhidos até ficarem ilegíveis. */
@media (max-width: 900px) {
  .toc { position: sticky; top: 52px; z-index: 3; flex-direction: row; flex-wrap: nowrap; overflow-x: auto; gap: 2px;
         margin: -18px -14px 0; padding: 8px 14px; background: var(--bg); border-bottom: 1px solid var(--line); scrollbar-width: none; }
  .toc::-webkit-scrollbar { display: none; }
  .toc b { display: none; }
  .toc a { flex: none; white-space: nowrap; font-size: 13px; padding: 5px 10px; }
  article.doc section { scroll-margin-top: 112px; }
  article.doc { font-size: 14px; }
  table.doc { display: block; overflow-x: auto; max-width: 100%; }
  table.doc td:first-child { white-space: normal; overflow-wrap: anywhere; min-width: 110px; }
  table.doc.opts td:first-child { width: auto; }
  .diagram { padding: 12px; }
  .diagram.wide { text-align: left; }
  .diagram.wide svg { max-width: none !important; width: var(--natural-width); }
}
@media (max-width: 520px) {
  article.doc h2 { font-size: 20px; }
  .cmd { padding: 10px 12px 2px; }
}
@media (max-width: 900px) { .docs { grid-template-columns: minmax(0, 1fr); gap: 20px; }
  .topbar { padding: 0 14px; } main { padding: 18px 14px 50px; } .seg { margin-left: 0; } table.compare td:first-child { width: auto; } }
</style>
</head>
<body>
<div class="topbar">
  <div class="brand"><svg class="mark" viewBox="64 64 384 384" aria-hidden="true"><path d="M365.7 134.1 A164 164 0 1 0 365.7 377.9" fill="none" stroke="#F97316" stroke-width="30" stroke-linecap="round"/><path d="M330.9 172.8 A112 112 0 1 0 330.9 339.2" fill="none" stroke="#14B8A6" stroke-width="30" stroke-linecap="round"/><path d="M296.1 211.4 A60 60 0 1 0 296.1 300.6" fill="none" stroke="#3B82F6" stroke-width="30" stroke-linecap="round"/><circle cx="256" cy="256" r="20" fill="currentColor"/></svg>ContextLab</div>
  <nav class="nav" aria-label="Seções">
    <button id="nav-runs" aria-current="page">Execuções</button>
    <button id="nav-docs">Documentação</button>
  </nav>
  <button class="icon-btn" id="theme" title="Alternar tema" aria-label="Alternar tema"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/></svg></button>
</div>

<main id="view-runs">
  <div class="head"><div><div class="crumb" id="crumb"></div><h1 id="title">ContextLab</h1></div><div class="tags" id="tags"></div></div>
  <section class="stats" id="kpis" aria-label="Indicadores"></section>
  <section class="panel" id="cards" aria-label="Comparação por estratégia"></section>
  <section class="panel">
    <div class="panel-head"><h2>Tentativas</h2><span class="count" id="count"></span></div>
    <div class="toolbar" id="filters"></div>
    <div class="wrap" id="table"></div>
  </section>
</main>

<main id="view-docs" hidden>
  <div class="docs">
    <nav class="toc" id="toc" aria-label="Sumário da documentação"><b>Documentação</b></nav>
    <article class="doc" id="doc"><!--__CONTEXTLAB_DOCS__--></article>
  </div>
</main>

<div class="backdrop" id="backdrop"></div>
<aside class="drawer" id="drawer" aria-label="Detalhe da tentativa">
  <header><div><h2 id="d-title"></h2><p id="d-sub"></p></div><button class="ghost" id="d-close">Fechar</button></header>
  <nav class="tabs" id="d-tabs"></nav>
  <div class="body" id="d-body"></div>
</aside>

<script type="application/json" id="data">/*__CONTEXTLAB_DATA__*/</script>
<!--__CONTEXTLAB_MERMAID__-->
<script>
"use strict";
// Todo conteúdo dos registros é inserido como texto (textContent); nada vindo das execuções é interpretado como HTML.
const DATA = JSON.parse(document.getElementById("data").textContent);
const ATTEMPTS = DATA.attempts;
const CONDITIONS = ["L", "R", "A"];
const NAMES = {L: "Local", R: "Recuperado", A: "Autônomo"};
const STATE_CLASS = {"aprovada": "s-aprovada", "reprovada": "s-reprovada", "aguardando revisão": "s-aguardando",
                     "infraestrutura": "s-infraestrutura", "pendente": "s-pendente", "sem desfecho": "s-sem"};
const state = {filters: {source: "", model: "", project: "", target: "", condition: "", state: "", repetition: "", q: ""},
               view: "tabela", sort: {key: "order", dir: 1}, selected: null, tab: "resumo", page: "runs"};

function el(tag, props, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props || {})) {
    if (value === null || value === undefined || value === false) continue;
    if (key === "class") node.className = value;
    else if (key === "text") node.textContent = value;
    else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
    else node.setAttribute(key, value === true ? "" : value);
  }
  for (const child of children.flat(3)) {
    if (child === null || child === undefined || child === false) continue;
    node.append(child instanceof Node ? child : document.createTextNode(String(child)));
  }
  return node;
}
const PRICED = Boolean(DATA.pricing) && ATTEMPTS.some(a => typeof a.cost === "number");
const CURRENCY = (DATA.pricing && DATA.pricing.moeda) || "USD";
const fmtInt = v => v === null || v === undefined ? "—" : Math.round(v).toLocaleString("pt-BR");
const fmtSec = v => v === null || v === undefined ? "—" : v.toLocaleString("pt-BR", {maximumFractionDigits: 1}) + " s";
const fmtPct = v => v === null || v === undefined ? "—" : (v * 100).toLocaleString("pt-BR", {maximumFractionDigits: 0}) + "%";
const fmtCost = (v, digits = 4) => v === null || v === undefined ? "—" : v.toLocaleString("pt-BR", {style: "currency", currency: CURRENCY, minimumFractionDigits: digits, maximumFractionDigits: digits});
const fmtDuration = v => v === null || v === undefined ? "—" : v >= 90 ? `${Math.floor(v / 60)} min ${Math.round(v % 60)} s` : fmtSec(v);
const nums = values => values.filter(x => typeof x === "number");
const sum = values => nums(values).reduce((a, b) => a + b, 0);
const mean = values => { const v = nums(values); return v.length ? sum(v) / v.length : null; };
const badge = text => el("span", {class: "badge " + (STATE_CLASS[text] || "s-sem"), text});
const cond = c => el("span", {class: "cond c-" + c, text: c});
const defectCount = a => { const e = a.defects.filter(d => d.eligible !== false); return [e.filter(d => d.detected === true).length, e.length]; };
const defectText = a => !a.defects.length ? "—" : defectCount(a).join("/") + (a.defects.some(d => d.eligible !== false && d.detected === null) ? "?" : "");
const casesText = a => a.cases.active === null || a.cases.active === undefined ? "—" : `${a.cases.passed ?? 0}/${a.cases.active}`;

function filtered() {
  const f = state.filters, q = f.q.trim().toLowerCase();
  return ATTEMPTS.filter(a =>
    (!f.source || a.source === f.source) && (!f.model || a.model === f.model) && (!f.project || a.project === f.project) &&
    (!f.target || a.target === f.target) && (!f.condition || a.condition === f.condition) &&
    (!f.state || a.state === f.state) && (!f.repetition || String(a.repetition) === f.repetition) &&
    (!q || [a.id, a.target, a.project, a.model, a.detail.test_code].some(t => t && t.toLowerCase().includes(q))));
}

const PHASES = {pilot: "Piloto", demo: "Demonstração", main: "Coleta principal"};
const fmtCompact = v => v === null || v === undefined ? "—" : v.toLocaleString("pt-BR", {notation: "compact", maximumFractionDigits: 1});
const tag = (text, cls, title) => el("span", {class: "tag" + (cls ? " " + cls : ""), text, title});
const info = title => el("i", {class: "info", title, text: "i"});

function renderHeader() {
  document.getElementById("title").textContent = DATA.title;
  document.title = DATA.title + " · ContextLab";
  document.getElementById("crumb").textContent = DATA.sources.length === 1 ? DATA.sources[0].id : `${DATA.sources.length} lotes`;
  const phases = [...new Set(DATA.sources.map(s => s.phase))];
  const models = [...new Set(ATTEMPTS.map(a => a.model).filter(Boolean))];
  document.getElementById("tags").replaceChildren(
    ...phases.map(p => p === "main" ? tag(PHASES[p]) : tag(PHASES[p] || p, "tag-warn", "Fora da coleta principal do experimento")),
    ...models.map(m => tag(m, "tag-mono", "Modelo")));
}

function statTile(label, value, sub, title) {
  return el("div", {class: "stat"}, el("span", {class: "stat-label"}, label, title ? info(title) : null), el("strong", {text: value}), sub);
}
function split(values, fmt) {
  return el("span", {class: "split"}, CONDITIONS.map(c => values[c] === undefined ? null :
    el("span", {title: NAMES[c]}, el("b", {class: "c-" + c, text: c}), fmt(values[c]))));
}

function renderKpis(rows) {
  // Cada indicador mostra a mesma medida no número principal e na divisão por estratégia:
  // totais somam o total, e a média geral é a média das tentativas de L, R e A.
  const obs = rows.filter(a => a.observable);
  const approved = rows.filter(a => a.state === "aprovada").length;
  const per = f => Object.fromEntries(CONDITIONS.filter(c => rows.some(a => a.condition === c)).map(c => [c, f(rows.filter(a => a.condition === c))]));
  const totalObs = key => per(items => sum(items.filter(a => a.observable).map(key)));
  const meanObs = key => per(items => mean(items.filter(a => a.observable).map(key)));
  const costKnown = obs.length > 0 && obs.every(a => typeof a.cost === "number");
  const total = sum(obs.map(a => a.cost));
  document.getElementById("kpis").replaceChildren(
    statTile("Tentativas", fmtInt(rows.length), split(per(items => items.length), String)),
    statTile("Aprovação", obs.length ? fmtPct(approved / obs.length) : "—",
      split(per(items => `${items.filter(a => a.state === "aprovada").length}/${items.filter(a => a.observable).length}`), String),
      "Suítes aprovadas na revisão sobre gerações observáveis"),
    statTile("Tokens de entrada", fmtCompact(sum(obs.map(a => a.tokens.input))), split(totalObs(a => a.tokens.input), fmtCompact),
      "Total do lote e total de cada estratégia. A média por tentativa está na comparação abaixo"),
    PRICED ? statTile("Custo estimado", costKnown ? fmtCost(total, 2) : "—", split(totalObs(a => a.cost), v => fmtCost(v, 3)),
      `Total do lote e de cada estratégia, por tarifas de API${DATA.pricing.consulta ? " de " + DATA.pricing.consulta.split("-").reverse().join("/") : ""}. Não é a despesa efetiva`)
      : statTile("Consultas", fmtInt(sum(obs.map(a => a.tool_calls))), split(totalObs(a => a.tool_calls), fmtInt)),
    statTile("Tempo médio de geração", fmtSec(mean(obs.map(a => a.seconds.generation))), split(meanObs(a => a.seconds.generation), fmtSec),
      "Média por tentativa, no lote e em cada estratégia"));
}

function renderCards(rows) {
  const stats = CONDITIONS.map(c => {
    const items = rows.filter(a => a.condition === c), observable = items.filter(a => a.observable);
    const approved = items.filter(a => a.state === "aprovada").length;
    const costs = observable.map(a => a.cost), complete = observable.length > 0 && costs.every(x => typeof x === "number");
    return {c, n: items.length, observable: observable.length, approved, rate: observable.length ? approved / observable.length : null,
            input: mean(observable.map(a => a.tokens.input)), output: mean(observable.map(a => a.tokens.output)),
            seconds: mean(observable.map(a => a.seconds.generation)), calls: mean(observable.map(a => a.tool_calls)),
            chars: mean(observable.map(a => a.context_chars)), cost: mean(costs),
            perApproved: complete && approved ? sum(costs) / approved : null};
  }).filter(s => s.n);
  const box = document.getElementById("cards");
  box.hidden = !stats.length;
  if (!stats.length) return;
  const dec = v => v === null || v === undefined ? "—" : v.toLocaleString("pt-BR", {maximumFractionDigits: 1});
  // [rótulo, formato, campo, menor é melhor]
  const metrics = [
    ["Aprovação", s => `${fmtPct(s.rate)} · ${s.approved}/${s.observable}`, "rate", false],
    ["Tokens de entrada", s => fmtInt(s.input), "input", true],
    ["Tokens de saída", s => fmtInt(s.output), "output", true],
    ["Contexto entregue", s => `${fmtInt(s.chars)} car.`, "chars", true],
    ["Consultas", s => dec(s.calls), "calls", true],
    ["Tempo de geração", s => fmtSec(s.seconds), "seconds", true],
    ...(PRICED ? [["Custo por tentativa", s => fmtCost(s.cost), "cost", true], ["Custo por suíte aprovada", s => fmtCost(s.perApproved), "perApproved", true]] : []),
  ];
  const best = (key, low) => { const v = nums(stats.map(s => s[key])); return v.length > 1 && new Set(v).size > 1 ? (low ? Math.min(...v) : Math.max(...v)) : null; };
  const table = el("table", {class: "compare"},
    el("thead", {}, el("tr", {}, el("th", {text: "Média por tentativa"}),
      stats.map(s => el("th", {}, el("span", {class: "colhead"}, cond(s.c), NAMES[s.c], el("small", {text: `${s.n} tentativas`})))))),
    el("tbody", {}, metrics.map(([label, fmt, key, low]) => {
      const top = Math.max(1e-12, ...stats.map(s => s[key] || 0)), b = best(key, low);
      return el("tr", {}, el("td", {text: label}), stats.map(s => el("td", {class: b !== null && s[key] === b ? "best" : ""},
        el("div", {class: "cv", style: `--c: var(--${s.c})`}, el("span", {text: fmt(s)}),
          el("i", {}, el("b", {style: `width:${(100 * (s[key] || 0) / top).toFixed(1)}%`}))))));
    })));
  box.replaceChildren(el("div", {class: "panel-head"}, el("h2", {text: "Comparação por estratégia"}),
    el("span", {class: "hint"}, el("span", {class: "best-mark", text: "melhor valor"}))), table);
}

function renderFilters() {
  const box = document.getElementById("filters");
  const options = (key, label, values) => el("label", {}, el("span", {text: label}),
    el("select", {style: `--pad:${label.length * 6.6 + 18}px`, title: label, onchange: e => { state.filters[key] = e.target.value; update(); }},
      el("option", {value: "", text: "todas"}),
      values.map(v => el("option", {value: String(v), text: String(v), selected: String(v) === state.filters[key]}))));
  const uniq = key => [...new Set(ATTEMPTS.map(a => a[key]))].filter(v => v !== null && v !== undefined)
    .sort((a, b) => String(a).localeCompare(String(b), "pt-BR", {numeric: true}));
  box.replaceChildren(...[
    DATA.sources.length > 1 ? options("source", "Execução", DATA.sources.map(s => s.id)) : null,
    uniq("model").length > 1 ? options("model", "Modelo", uniq("model")) : null,
    uniq("project").length > 1 ? options("project", "Projeto", uniq("project")) : null,
    options("target", "Função", uniq("target")),
    options("condition", "Estratégia", CONDITIONS.filter(c => ATTEMPTS.some(a => a.condition === c))),
    uniq("repetition").length > 1 ? options("repetition", "Repetição", uniq("repetition")) : null,
    options("state", "Situação", uniq("state")),
    el("input", {type: "search", placeholder: "Buscar função ou trecho do teste", "aria-label": "Buscar", value: state.filters.q,
      oninput: e => { state.filters.q = e.target.value; update(false); }}),
    el("div", {class: "seg", role: "group", "aria-label": "Visão"},
      ["tabela", "por função"].map(v => el("button", {"aria-pressed": String(state.view === v), text: v === "tabela" ? "Tabela" : "Por função",
        onclick: () => { state.view = v; update(); }})))].filter(Boolean));
}

const COLUMNS = [
  {key: "source", label: "Execução", get: a => a.source, show: () => DATA.sources.length > 1},
  {key: "order", label: "Nº", get: a => a.order, num: true},
  {key: "project", label: "Projeto", get: a => a.project, show: () => new Set(ATTEMPTS.map(a => a.project)).size > 1},
  {key: "target", label: "Função", get: a => a.target, cell: a => el("span", {class: "target", text: a.target})},
  {key: "condition", label: "Estr.", get: a => a.condition, cell: a => cond(a.condition)},
  {key: "repetition", label: "Rep.", get: a => a.repetition, num: true},
  {key: "state", label: "Situação", get: a => a.state, cell: a => badge(a.state)},
  {key: "cases", label: "Casos", get: a => a.cases.passed ?? -1, cell: a => casesText(a), num: true, title: "Casos aprovados / casos ativos"},
  {key: "line", label: "Linhas", get: a => a.coverage.line_rate ?? -1, cell: a => fmtPct(a.coverage.line_rate) + (a.coverage.line_rate !== null && !a.coverage.primary ? "*" : ""), num: true,
   title: "Cobertura de linhas da função. * = diagnóstica: a suíte não está aprovada"},
  {key: "branch", label: "Ramif.", get: a => a.coverage.branch_rate ?? -1, cell: a => fmtPct(a.coverage.branch_rate) + (a.coverage.branch_rate !== null && !a.coverage.primary ? "*" : ""), num: true},
  {key: "defects", label: "Defeitos", get: a => defectCount(a)[1] ? defectCount(a)[0] / defectCount(a)[1] : -1, cell: a => defectText(a), num: true,
   title: "Defeitos detectados / defeitos elegíveis; medido só em suítes aprovadas", show: () => ATTEMPTS.some(a => a.defects.length)},
  {key: "tin", label: "Tok. entrada", get: a => a.tokens.input ?? -1, cell: a => fmtInt(a.tokens.input), num: true},
  {key: "tout", label: "Tok. saída", get: a => a.tokens.output ?? -1, cell: a => fmtInt(a.tokens.output), num: true},
  {key: "cost", label: "Custo est.", get: a => a.cost ?? -1, cell: a => fmtCost(a.cost), num: true, show: () => PRICED,
   title: "Estimativa por tarifas de API; não é despesa efetiva"},
  {key: "chars", label: "Caracteres", get: a => a.context_chars ?? -1, cell: a => fmtInt(a.context_chars), num: true, title: "Caracteres de contexto entregues"},
  {key: "calls", label: "Consultas", get: a => a.tool_calls ?? -1, cell: a => fmtInt(a.tool_calls), num: true},
  {key: "gen", label: "Geração", get: a => a.seconds.generation ?? -1, cell: a => fmtSec(a.seconds.generation), num: true},
];

function renderTable(rows) {
  const columns = COLUMNS.filter(c => !c.show || c.show());
  const sortColumn = columns.find(c => c.key === state.sort.key) || columns[0];
  const sorted = [...rows].sort((a, b) => {
    const x = sortColumn.get(a), y = sortColumn.get(b);
    const base = typeof x === "number" && typeof y === "number" ? x - y : String(x).localeCompare(String(y), "pt-BR", {numeric: true});
    return (base || a.key.localeCompare(b.key)) * state.sort.dir;
  });
  const head = el("tr", {}, columns.map(c => el("th", {class: c.num ? "num" : "", title: c.title, scope: "col",
    onclick: () => { state.sort = {key: c.key, dir: state.sort.key === c.key ? -state.sort.dir : 1}; update(false); }},
    c.label + (state.sort.key === c.key ? (state.sort.dir > 0 ? " ↑" : " ↓") : ""))));
  const body = sorted.map(a => el("tr", {class: "row", tabindex: "0", onclick: () => openAttempt(a.key), onkeydown: e => { if (e.key === "Enter") openAttempt(a.key); }},
    columns.map(c => el("td", {class: c.num ? "num" : ""}, c.cell ? c.cell(a) : String(c.get(a))))));
  return el("table", {}, el("thead", {}, head), el("tbody", {}, body));
}

function renderByFunction(rows) {
  const groups = new Map();
  for (const a of rows) {
    const key = [a.source, a.project, a.target, a.repetition].join("\u0000");
    if (!groups.has(key)) groups.set(key, {a, items: {}});
    groups.get(key).items[a.condition] = a;
  }
  const many = DATA.sources.length > 1;
  const cell = a => !a ? el("td", {}, el("span", {class: "muted", text: "—"})) :
    el("td", {class: "pick", tabindex: "0", onclick: () => openAttempt(a.key), onkeydown: e => { if (e.key === "Enter") openAttempt(a.key); }},
      el("div", {class: "cell"}, badge(a.state),
        el("span", {text: `Casos ${casesText(a)} · linhas ${fmtPct(a.coverage.line_rate)}` + (a.defects.length ? ` · defeitos ${defectText(a)}` : "")}),
        el("small", {text: `${fmtInt(a.tokens.input)} tok. entrada · ${fmtInt(a.tokens.output)} saída` + (PRICED ? ` · ${fmtCost(a.cost)}` : "")}),
        el("small", {text: `${fmtInt(a.context_chars)} caracteres · ${fmtInt(a.tool_calls)} consulta(s) · ${fmtSec(a.seconds.generation)}`})));
  const body = [...groups.values()].map(g => el("tr", {},
    many ? el("td", {text: g.a.source}) : null,
    el("td", {}, el("strong", {text: g.a.target}), el("br"), el("small", {class: "muted", text: `${g.a.project} · repetição ${g.a.repetition}`})),
    CONDITIONS.map(c => cell(g.items[c]))));
  return el("table", {}, el("thead", {}, el("tr", {}, many ? el("th", {text: "Execução"}) : null, el("th", {text: "Função"}),
    CONDITIONS.map(c => el("th", {}, cond(c), " " + NAMES[c])))), el("tbody", {}, body));
}

const codeBlock = text => el("ol", {class: "code"}, text.replace(/\n$/, "").split("\n").map(line => el("li", {}, el("span", {text: line || " "}))));
const TABS = [["resumo", "Resumo"], ["casos", "Casos"], ["teste", "Teste gerado"], ["contexto", "Contexto"], ["consultas", "Consultas"], ["enunciado", "Enunciado"]];

function tabBody(a) {
  const d = a.detail, out = [];
  if (state.tab === "resumo") {
    out.push(el("dl", {class: "kv"},
      el("dt", {text: "Situação"}), el("dd", {}, badge(a.state)),
      el("dt", {text: "Estratégia"}), el("dd", {}, cond(a.condition), ` ${NAMES[a.condition]} · repetição ${a.repetition} · ordem ${a.order}`),
      el("dt", {text: "Modelo"}), el("dd", {text: (a.model || "—") + (a.agent_version ? ` · ${a.agent_version}` : "") + (a.simulated ? " · entrega autoral fixa" : "")}),
      el("dt", {text: "Geração"}), el("dd", {text: a.generation_status || "—"}),
      el("dt", {text: "Avaliação"}), el("dd", {text: (a.evaluation_status || "—") + (a.failure_categories.length ? " · " + a.failure_categories.join(", ") : "")}),
      el("dt", {text: "Casos"}), el("dd", {text: `${a.cases.passed ?? "—"} aprovados de ${a.cases.active ?? "—"} ativos (${a.cases.collected ?? "—"} coletados, ${a.cases.skipped ?? 0} ignorados, ${a.cases.xfail ?? 0} falha esperada)`}),
      el("dt", {text: "Cobertura de linhas"}), el("dd", {text: `${fmtPct(a.coverage.line_rate)} (${a.coverage.line_covered ?? "—"}/${a.coverage.line_total ?? "—"})` + (a.coverage.line_rate !== null && !a.coverage.primary ? " — diagnóstica, suíte não aprovada" : "")}),
      el("dt", {text: "Cobertura de ramificações"}), el("dd", {text: a.coverage.branch_total ? `${fmtPct(a.coverage.branch_rate)} (${a.coverage.branch_covered}/${a.coverage.branch_total})` : "não aplicável"}),
      el("dt", {text: "Tokens"}), el("dd", {text: `${fmtInt(a.tokens.input)} de entrada (${fmtInt(a.tokens.cached_input)} em cache) · ${fmtInt(a.tokens.output)} de saída (${fmtInt(a.tokens.reasoning_output)} de raciocínio)`}),
      PRICED ? [el("dt", {text: "Custo estimado"}), el("dd", {text: fmtCost(a.cost) + " — tarifas de API" + (DATA.pricing.fonte ? `, fonte: ${DATA.pricing.fonte}` : "") + "; não é despesa efetiva"})] : null,
      el("dt", {text: "Contexto entregue"}), el("dd", {text: `${fmtInt(a.context_chars)} caracteres de ${fmtInt(a.budget)} (${fmtInt(a.initial_chars)} iniciais) · ${fmtInt(a.tool_calls)} consulta(s)`}),
      el("dt", {text: "Tempos"}), el("dd", {text: `preparação ${fmtSec(a.seconds.preparation)} · geração ${fmtSec(a.seconds.generation)} · avaliação ${fmtSec(a.seconds.evaluation)}`}),
      el("dt", {text: "Início"}), el("dd", {text: a.started_at ? new Date(a.started_at).toLocaleString("pt-BR") : "—"})));
    if (d.error) out.push(el("h3", {class: "sec", text: "Erro registrado"}), el("pre", {class: "wrapped", text: d.error}));
    if (d.generation_details.length) out.push(el("h3", {class: "sec", text: "Detalhes da geração"}), el("pre", {class: "wrapped", text: d.generation_details.join("\n")}));
    if (a.defects.length) out.push(el("h3", {class: "sec", text: "Defeitos controlados"}),
      el("dl", {class: "kv"}, a.defects.flatMap(x => [el("dt", {}, el("code", {text: x.id})), el("dd", {text: x.status + (x.eligible === false ? " (inelegível)" : "")})])));
    out.push(el("h3", {class: "sec", text: "Revisão humana"}), d.review
      ? el("dl", {class: "kv"}, Object.entries(d.review).flatMap(([k, v]) => [el("dt", {text: k}), el("dd", {text: typeof v === "object" ? JSON.stringify(v) : String(v)})]))
      : el("p", {class: "muted", text: "Sem revisão registrada. A revisão é feita pelo comando review."}));
  } else if (state.tab === "casos") {
    if (!d.cases.length) out.push(el("p", {class: "muted", text: "Nenhum caso registrado para esta tentativa."}));
    const order = {failed: 0, skipped: 1, passed: 2};
    for (const c of [...d.cases].sort((x, y) => (order[x.outcome] ?? 3) - (order[y.outcome] ?? 3))) {
      const label = c.outcome === "passed" ? "aprovada" : c.outcome === "failed" ? "reprovada" : "pendente";
      const text = c.outcome === "passed" ? "passou" : c.outcome === "failed" ? `falhou (${c.phase === "call" ? (c.exception || "erro") : c.phase})` :
        c.outcome === "skipped" ? "ignorado" : "não executado";
      out.push(el("details", {class: "case", open: c.outcome === "failed"},
        el("summary", {}, el("span", {class: "badge " + STATE_CLASS[label], text}), el("span", {class: "mono", text: c.name}),
          c.expected_failure ? el("small", {class: "muted", text: "falha esperada"}) : null),
        c.message ? el("pre", {text: c.message}) : null));
    }
  } else if (state.tab === "teste") {
    if (d.test_code) out.push(codeBlock(d.test_code));
    else if (d.response) out.push(el("p", {class: "muted", text: "A resposta não gerou um arquivo de teste válido. Resposta recebida:"}), el("pre", {class: "wrapped", text: d.response}));
    else out.push(el("p", {class: "muted", text: "Não há entrega preservada para esta tentativa."}));
  } else if (state.tab === "contexto") {
    const c = d.context;
    if (!c) out.push(el("p", {class: "muted", text: "Contexto não registrado."}));
    else {
      if (a.condition === "R") out.push(el("p", {text: c.equal_to_local ? "Neste alvo, R não acrescentou conteúdo a L." : "R acrescentou conteúdo a L."}));
      if (c.snippets.length) out.push(el("h3", {class: "sec", text: "Trechos do pacote inicial"}), el("dl", {class: "kv"},
        c.snippets.flatMap(s => [el("dt", {}, el("code", {text: s.key})), el("dd", {text: `${s.reason} · ${fmtInt(s.chars)} caracteres`})])));
      if (c.available.length) out.push(el("h3", {class: "sec", text: `Arquivos disponíveis para consulta (${c.available.length})`}), el("pre", {text: c.available.join("\n")}),
        el("p", {class: "muted", text: "Disponível não significa lido: veja a aba Consultas."}));
      if (c.omitted.length) out.push(el("h3", {class: "sec", text: "Omitidos por limite"}), el("pre", {text: c.omitted.map(o => o.key).join("\n")}));
      if (c.unresolved.length) out.push(el("h3", {class: "sec", text: `Referências não resolvidas (${c.unresolved.length})`}),
        el("pre", {text: c.unresolved.map(u => `${u.reference ?? u.path ?? "?"} — ${u.reason}`).join("\n")}));
      if (c.text) out.push(el("h3", {class: "sec", text: "Conteúdo entregue"}), el("pre", {text: c.text}));
    }
  } else if (state.tab === "consultas") {
    if (!d.tool_log.length) out.push(el("p", {class: "muted", text: "Nenhuma consulta registrada."}));
    else out.push(el("div", {class: "wrap"}, el("table", {}, el("thead", {}, el("tr", {}, ["Nº", "Ferramenta", "Argumentos", "Situação", "Caracteres", "Acumulado"].map((t, i) => el("th", {class: i > 3 ? "num" : "", text: t, style: "cursor: default"})))),
      el("tbody", {}, d.tool_log.map(t => el("tr", {},
        el("td", {text: t.index}), el("td", {}, el("code", {text: t.tool})),
        el("td", {style: "white-space: normal"}, el("span", {class: "mono", text: JSON.stringify(t.arguments ?? {})})),
        el("td", {text: t.status}), el("td", {class: "num", text: fmtInt(t.delivered_chars)}), el("td", {class: "num", text: fmtInt(t.chars_after)})))))));
  } else if (state.tab === "enunciado") {
    out.push(d.prompt ? el("pre", {class: "wrapped", text: d.prompt}) : el("p", {class: "muted", text: "Enunciado não registrado."}));
  }
  return out;
}

function renderDrawer() {
  const a = ATTEMPTS.find(x => x.key === state.selected);
  document.getElementById("drawer").classList.toggle("open", Boolean(a));
  document.getElementById("backdrop").classList.toggle("open", Boolean(a));
  if (!a) return;
  document.getElementById("d-title").replaceChildren(a.target, cond(a.condition), el("span", {class: "muted", text: `repetição ${a.repetition}`}));
  document.getElementById("d-sub").textContent = `${a.project} · ${a.detail.path}`;
  document.getElementById("d-tabs").replaceChildren(...TABS.map(([id, label]) => el("button", {role: "tab", "aria-selected": String(state.tab === id), text: label,
    onclick: () => { state.tab = id; syncHash(); renderDrawer(); }})));
  const body = document.getElementById("d-body");
  body.replaceChildren(...tabBody(a));
  body.scrollTop = 0;
}

// O endereço guarda a página, a tentativa e a aba abertas, para voltar ao mesmo ponto ou indicá-lo a alguém.
function syncHash() {
  const value = state.page === "docs" ? "#docs" : state.selected ? "#" + encodeURIComponent(state.selected) + "@" + state.tab : "";
  history.replaceState(null, "", value || location.pathname + location.search);
}
function fromHash() {
  const raw = decodeURIComponent(location.hash.slice(1));
  if (raw === "docs" || raw.startsWith("docs/")) { state.page = "docs"; return raw.split("/")[1]; }
  const [key, tab] = raw.split("@");
  if (ATTEMPTS.some(a => a.key === key)) {
    state.selected = key;
    if (TABS.some(([id]) => id === tab)) state.tab = tab;
  }
  return null;
}
function openAttempt(key) { state.selected = key; syncHash(); renderDrawer(); }
function closeDrawer() { state.selected = null; syncHash(); renderDrawer(); }

function update(rebuildFilters = true) {
  const rows = filtered();
  renderKpis(rows);
  renderCards(rows);
  if (rebuildFilters) renderFilters();
  document.getElementById("count").textContent = rows.length === ATTEMPTS.length ? `${rows.length}` : `${rows.length} de ${ATTEMPTS.length}`;
  document.getElementById("table").replaceChildren(rows.length ? (state.view === "tabela" ? renderTable(rows) : renderByFunction(rows))
    : el("div", {class: "empty", text: "Nenhuma tentativa corresponde aos filtros."}));
}

// ---- Documentação -----------------------------------------------------------------------------
let docsReady = false;
const isDark = () => document.documentElement.dataset.theme === "dark";

async function renderDiagrams() {
  const blocks = [...document.querySelectorAll("#doc pre.mermaid-src")];
  // Sem a biblioteca, o texto do diagrama permanece legível.
  if (typeof mermaid === "undefined") { blocks.forEach(b => b.classList.add("shown")); return; }
  const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  mermaid.initialize({startOnLoad: false, securityLevel: "strict", theme: "base",
    themeVariables: {darkMode: isDark(), background: css("--panel"), primaryColor: css("--accent-soft"), primaryTextColor: css("--ink"),
      primaryBorderColor: css("--accent"), lineColor: css("--muted"), secondaryColor: css("--panel-2"), tertiaryColor: css("--panel-2"),
      clusterBkg: css("--panel-2"), clusterBorder: css("--line"), edgeLabelBackground: css("--panel"), textColor: css("--ink"),
      noteBkgColor: css("--wait-bg"), noteTextColor: css("--wait"), noteBorderColor: css("--wait"),
      actorBkg: css("--accent-soft"), actorBorder: css("--accent"), actorTextColor: css("--ink"), signalColor: css("--muted"), signalTextColor: css("--ink"),
      labelBoxBkgColor: css("--panel-2"), labelBoxBorderColor: css("--line"), labelTextColor: css("--ink"), loopTextColor: css("--ink"),
      activationBkgColor: css("--panel-2"), sequenceNumberColor: css("--accent-ink"), fontSize: "14px"},
    fontFamily: getComputedStyle(document.body).fontFamily,  flowchart: {curve: "basis", htmlLabels: true, useMaxWidth: true, padding: 14},
    sequence: {useMaxWidth: true, mirrorActors: false}});
  for (const [index, block] of blocks.entries()) {
    let holder = block.nextElementSibling;
    if (!holder || !holder.classList.contains("diagram")) { holder = el("div", {class: "diagram"}); block.after(holder); }
    try {
      // A fonte do diagrama é texto autoral desta página, nunca dado de execução.
      const {svg} = await mermaid.render(`diagrama-${index}-${isDark() ? "d" : "l"}`, block.textContent);
      holder.innerHTML = svg;
      // Diagramas largos mantêm o tamanho natural em tela estreita e rolam na horizontal.
      const box = holder.querySelector("svg")?.viewBox?.baseVal;
      holder.classList.toggle("wide", Boolean(box && box.width / box.height > 2.2));
      if (box) holder.style.setProperty("--natural-width", Math.round(box.width * 0.85) + "px");
      block.hidden = true;
    } catch (error) { holder.remove(); block.hidden = false; block.classList.add("shown"); }
  }
  document.documentElement.dataset.diagrams = "ok";
}

function liveConfig() {
  const source = [...DATA.sources].reverse().find(s => s.config);
  const box = document.getElementById("doc-live-config");
  if (!box || !source) return;
  box.replaceChildren(el("h3", {text: "Configuração congelada desta página"}),
    el("p", {}, "Manifesto do lote ", el("code", {text: source.id}), ", como foi congelado. Caminhos locais foram omitidos."),
    el("pre", {text: JSON.stringify(source.config, null, 2)}));
}

function setupDocs() {
  if (docsReady) return Promise.resolve();
  docsReady = true;
  const toc = document.getElementById("toc");
  const sections = [...document.querySelectorAll("#doc > section")];
  for (const section of sections) toc.append(el("a", {href: "#docs/" + section.id, text: section.dataset.title,
    onclick: e => { e.preventDefault(); section.scrollIntoView(); history.replaceState(null, "", "#docs/" + section.id); }}));
  const links = [...toc.querySelectorAll("a")];
  const spy = new IntersectionObserver(entries => {
    for (const entry of entries) if (entry.isIntersecting)
      links.forEach(a => {
        const on = a.getAttribute("href") === "#docs/" + entry.target.id;
        a.classList.toggle("on", on);
        // No celular o sumário é uma linha rolável: mantém a seção atual visível nela.
        if (on && toc.scrollWidth > toc.clientWidth) toc.scrollTo({left: a.offsetLeft - 14, behavior: "smooth"});
      });
  }, {rootMargin: "-90px 0px -65% 0px"});
  sections.forEach(s => spy.observe(s));
  liveConfig();
  return renderDiagrams();
}

function showPage(page, anchor) {
  state.page = page;
  document.getElementById("view-runs").hidden = page !== "runs";
  document.getElementById("view-docs").hidden = page !== "docs";
  for (const name of ["runs", "docs"]) {
    const button = document.getElementById("nav-" + name);
    if (name === page) button.setAttribute("aria-current", "page"); else button.removeAttribute("aria-current");
  }
  if (page === "docs") {
    state.selected = null; renderDrawer(); setupDocs();
    const target = anchor && document.getElementById(anchor);
    if (target) target.scrollIntoView(); else window.scrollTo(0, 0);
  }
}

// ---- Tema --------------------------------------------------------------------------------------
function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  try { localStorage.setItem("contextlab-tema", theme); } catch (error) { /* arquivo local sem armazenamento */ }
  if (docsReady) renderDiagrams();
}
let saved = null;
try { saved = localStorage.getItem("contextlab-tema"); } catch (error) { saved = null; }
const forced = new URLSearchParams(location.search).get("tema");
document.documentElement.dataset.theme = ["light", "dark"].includes(forced) ? forced
  : saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");

document.getElementById("theme").addEventListener("click", () => applyTheme(isDark() ? "light" : "dark"));
if (!DATA.site) {
  document.getElementById("nav-runs").addEventListener("click", () => { showPage("runs"); syncHash(); });
  document.getElementById("nav-docs").addEventListener("click", () => { showPage("docs"); syncHash(); });
  document.getElementById("d-close").addEventListener("click", closeDrawer);
  document.getElementById("backdrop").addEventListener("click", closeDrawer);
  document.addEventListener("keydown", e => { if (e.key === "Escape" && state.selected) closeDrawer(); });
}

// Site público: só a documentação, sem registros de execução.
if (DATA.site) {
  // O HTML do site já chega só com a documentação (ver build_site); aqui só sai o que sobrou.
  for (const id of ["nav-runs", "view-runs", "backdrop", "drawer"]) document.getElementById(id)?.remove();
  const raw = decodeURIComponent(location.hash.slice(1));
  state.page = "docs";
  const target = raw.startsWith("docs/") && document.getElementById(raw.slice(5));
  if (target) target.scrollIntoView();
  // Os diagramas mudam a altura da página: reposiciona depois de desenhá-los.
  setupDocs().then(() => { if (target) target.scrollIntoView(); });
} else {
  renderHeader();
  const anchor = fromHash();
  update();
  renderDrawer();
  showPage(state.page, anchor);
}
</script>
</body>
