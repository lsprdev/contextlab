[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cambio-contextlab"
version = "0.1.0"
description = "CLI didática de cotações e conversão para reais"
requires-python = ">=3.11"
dependencies = ["rich==14.1.0"]

[project.scripts]
cambio = "cambio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
