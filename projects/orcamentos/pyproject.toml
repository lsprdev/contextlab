[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orcaapi-contextlab"
version = "0.1.0"
description = "OrçaAPI: API didática de orçamentos com SQLite"
requires-python = ">=3.12"
dependencies = ["fastapi==0.162.0", "pydantic==2.14.2", "httpx==0.28.1", "uvicorn==0.54.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
